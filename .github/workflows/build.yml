name: Build

# The rebuild bot. Two trigger axes, because this image has no release cadence
# of its own to ride:
#
#   1. Upstream Caddy releases.
#   2. The Go toolchain — for a Go HTTP server the recurring CVE source is the
#      standard library (HTTP/2, TLS, header parsing), fixed by rebuilding on a
#      patched toolchain. The daily schedule covers this: it rebuilds whenever
#      the digest of the upstream builder image has moved, even when the Caddy
#      version has not.
#
# ⚠️ Building this image moved Caddy's security responsibility from upstream to
# us. If this workflow stalls, installs stop receiving Caddy fixes and nothing
# says so out loud. Treat a red run here as a security issue, not a chore.

on:
  workflow_dispatch:
    inputs:
      caddy_version:
        description: "Upstream Caddy version (blank = latest release)"
        required: false
        type: string
      revision:
        description: "Module-list revision for this Caddy version"
        required: false
        default: "1"
        type: string
      belune_ref:
        description: "Belune ref to gate against (blank = latest stable tag)"
        required: false
        type: string
      promote:
        description: "Move the floating :2 tag if the suites pass"
        required: false
        default: false
        type: boolean
  schedule:
    # Daily. Cheap when nothing moved: resolve exits early.
    - cron: "17 6 * * *"
  push:
    branches: [main]
    # The promote job commits .build-state.json; without this the bot would
    # retrigger itself on its own bookkeeping.
    paths-ignore: [".build-state.json"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/belune-hq/belune-caddy
  # The repository holding the integration suites that gate promotion. Public,
  # so no token is needed to check it out.
  BELUNE_REPO: weiliang79/belune

jobs:
  resolve:
    name: Resolve target version
    runs-on: ubuntu-latest
    outputs:
      caddy_version: ${{ steps.pick.outputs.caddy_version }}
      revision: ${{ steps.pick.outputs.revision }}
      builder_digest: ${{ steps.pick.outputs.builder_digest }}
      bump: ${{ steps.pick.outputs.bump }}
      should_build: ${{ steps.pick.outputs.should_build }}
    steps:
      - uses: actions/checkout@v5

      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.caddy_version }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail

          # The Dockerfile's default is the version this repo currently claims.
          CURRENT=$(sed -n 's/^ARG CADDY_VERSION=//p' Dockerfile | head -1)
          echo "repo currently pins: $CURRENT"

          if [ -n "${INPUT_VERSION}" ]; then
            TARGET="${INPUT_VERSION}"
          else
            TARGET=$(gh api repos/caddyserver/caddy/releases/latest --jq .tag_name | sed 's/^v//')
          fi
          echo "upstream latest:     $TARGET"

          # Both values are interpolated into later shell commands by the
          # workflow engine, so they are validated HERE, once, rather than
          # quoted carefully in five places. Anything that is not a plain
          # version is refused outright.
          # (Careful: writing a literal GitHub expression in this comment would
          # be PARSED as one — a run: block is expression-interpolated first.)
          case "$TARGET" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::refusing a version that is not N.N.N: $TARGET"; exit 1 ;;
          esac
          case "${INPUT_REVISION:-1}" in
            ''|*[!0-9]*) echo "::error::revision must be digits"; exit 1 ;;
          esac

          # The Go toolchain axis, made observable: the upstream BUILDER image
          # is what carries the Go version, so when its digest moves we must
          # rebuild even though the Caddy version has not changed.
          BUILDER="caddy:${TARGET}-builder-alpine"
          BUILDER_DIGEST=$(docker buildx imagetools inspect "$BUILDER" \
            --format '{{.Manifest.Digest}}')
          echo "builder digest:      $BUILDER_DIGEST"

          STATE_VERSION=$(jq -r .caddy_version .build-state.json)
          STATE_DIGEST=$(jq -r .builder_digest .build-state.json)
          STATE_REVISION=$(jq -r .revision .build-state.json)

          # ⛔ A published <version>-<revision> tag is IMMUTABLE. Rebuilding at
          # the same Caddy version must bump the revision, never overwrite —
          # overwriting makes rollback impossible and "which Caddy is this
          # install running" unanswerable, which is the whole reason the
          # revision exists.
          REVISION="$STATE_REVISION"
          if [ -n "${INPUT_VERSION}" ] || [ -n "${INPUT_REVISION}" ]; then
            SHOULD_BUILD="true"                      # explicit dispatch wins
            REVISION="${INPUT_REVISION:-$STATE_REVISION}"
          elif [ "$TARGET" != "$STATE_VERSION" ]; then
            SHOULD_BUILD="true"                      # new Caddy
            REVISION=1
          elif [ "$BUILDER_DIGEST" != "$STATE_DIGEST" ]; then
            SHOULD_BUILD="true"                      # same Caddy, new toolchain
            REVISION=$((STATE_REVISION + 1))
          else
            SHOULD_BUILD="false"                     # the daily no-op
          fi
          echo "should build:        $SHOULD_BUILD (revision $REVISION)"

          # patch vs minor decides whether promotion may be automatic.
          cur_mm="${CURRENT%.*}"; tgt_mm="${TARGET%.*}"
          if [ "$CURRENT" = "$TARGET" ]; then
            BUMP="none"
          elif [ "$cur_mm" = "$tgt_mm" ]; then
            BUMP="patch"
          else
            BUMP="minor"
          fi

          {
            echo "caddy_version=$TARGET"
            echo "revision=$REVISION"
            echo "builder_digest=$BUILDER_DIGEST"
            echo "bump=$BUMP"
            echo "should_build=$SHOULD_BUILD"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Resolved"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| repo pins | \`$CURRENT\` |"
            echo "| target | \`$TARGET\` |"
            echo "| bump | \`$BUMP\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build image
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5
      # QEMU before buildx, matching Belune's own release workflow: the arm64
      # half is emulated on an amd64 runner and needs the binfmt handlers.
      # Without it that leg fails rather than merely being slow.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: |
          REF="${IMAGE}:${{ needs.resolve.outputs.caddy_version }}-${{ needs.resolve.outputs.revision }}"
          echo "image_ref=$REF" >> "$GITHUB_OUTPUT"

      # Push only on main/dispatch. A pull request builds and tests without
      # publishing anything.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ⛔ The versioned tag is NOT the floating :2 tag. :2 moves only in the
      # promote job, after the suites pass — that separation is the gate.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            CADDY_VERSION=${{ needs.resolve.outputs.caddy_version }}
            BELUNE_CADDY_REVISION=${{ needs.resolve.outputs.revision }}
          # ⚠️ No `load:` here. The docker exporter cannot load a multi-platform
          # build, so loading and `platforms:` are mutually exclusive — the
          # single-arch image the next step needs is built there instead, off
          # this step's cache.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The modules must actually be in the binary
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load \
            --build-arg "CADDY_VERSION=${{ needs.resolve.outputs.caddy_version }}" \
            -t belune-caddy:verify . >/dev/null
          MODS=$(docker run --rm --entrypoint caddy belune-caddy:verify list-modules)
          echo "$MODS" | sed -n '1,5p'
          # One representative module per capability Belune probes for. A build
          # that silently dropped one would otherwise publish and only surface
          # later as a feature reporting "not configured" on every install.
          for m in http.handlers.rate_limit dns.providers.cloudflare dns.providers.route53 \
                   dns.providers.digitalocean http.handlers.waf http.handlers.crowdsec layer4; do
            echo "$MODS" | grep -qx "$m" || { echo "::error::module missing from the build: $m"; exit 1; }
          done
          echo "all probed modules present"

  test:
    name: Belune integration suites
    needs: [resolve, build]
    # A pull request does not publish, so there is no image for this job to
    # pull — jobs run on separate runners and the build never left its own.
    # A PR therefore gets the build and the module check; the suites run on
    # the paths that actually produce a published image.
    if: needs.resolve.outputs.should_build == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Each job gets a fresh runner, so the build job's login does not carry
      # over — and a newly published GHCR package is private, so pulling the
      # image under test needs credentials even inside the same org.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The gate lives in the Belune repo. Pinned to the latest STABLE tag, not
      # main: installs run released Belune, so that is what this image has to
      # work with. Testing against unreleased main would gate on code nobody
      # is running yet.
      # Default: the latest STABLE tag, because installs run released Belune
      # and that is what this image has to work with.
      #
      # ⚠️ The cost of that default: a fix to these suites does not reach the
      # gate until Belune's next release, so the bot stays red in between. The
      # BELUNE_GATE_REF repository variable is the escape hatch — set it to
      # `main` while a Belune release is in development, and unset it when the
      # release ships. The dispatch input overrides both for a one-off run.
      - name: Check out Belune
        env:
          INPUT_REF: ${{ inputs.belune_ref }}
          VAR_REF: ${{ vars.BELUNE_GATE_REF }}
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none "https://github.com/${BELUNE_REPO}.git" belune
          cd belune
          REF="${INPUT_REF:-${VAR_REF:-}}"
          if [ -z "$REF" ]; then
            REF=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v -- '-' | head -1)
            echo "gating against the latest stable tag: $REF"
          else
            echo "::warning::gating against '$REF', not the latest stable tag"
          fi
          git checkout --quiet "$REF"
          echo "BELUNE_TAG=$REF" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version-file: belune/apps/api/go.mod
          cache-dependency-path: belune/apps/api/go.sum

      # The suites do NOT start Caddy — they drive an existing admin API at
      # CADDY_ADMIN_URL. So stand the built image up the way Belune runs it,
      # with Belune's own Caddyfile, or the test proves nothing about this image.
      - name: Start the built Caddy
        run: |
          set -euo pipefail
          docker run -d --name caddy \
            -p 127.0.0.1:2019:2019 -p 80:80 -p 443:443 \
            -e BELUNE_CADDY_GLOBAL_OPTIONS=local_certs \
            -e BELUNE_DASHBOARD_UPSTREAM=host.docker.internal:8080 \
            -v "$PWD/belune/infra/caddy/Caddyfile.template:/etc/caddy/Caddyfile" \
            -v "$PWD/belune/infra/caddy/sites:/etc/caddy/sites" \
            ${{ needs.build.outputs.image_ref }}
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:2019/config/ >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:2019/config/ >/dev/null \
            || { echo "::error::admin API never came up"; docker logs caddy; exit 1; }

      # -p 1: these drive one shared Caddy and will fight over its config if
      # the packages run in parallel.
      - name: Run the suites
        working-directory: belune/apps/api
        env:
          BELUNE_CADDY_INTEGRATION: "1"
          CADDY_ADMIN_URL: http://localhost:2019
        run: |
          go test -count=1 -p 1 -timeout=30m \
            ./internal/proxy/caddy/ ./internal/proxy/ ./internal/worker/

      - name: Caddy logs on failure
        if: failure()
        run: docker logs caddy || echo "(no container — it never started)"

  promote:
    name: Promote the floating tag
    needs: [resolve, build, test]
    if: >-
      needs.resolve.outputs.should_build == 'true' &&
      github.event_name != 'pull_request' &&
      (needs.resolve.outputs.bump == 'patch' || needs.resolve.outputs.bump == 'none' ||
       (github.event_name == 'workflow_dispatch' && inputs.promote))
    runs-on: ubuntu-latest
    permissions:
      packages: write
      # Also writes .build-state.json back, which is the digest check's memory.
      contents: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Move :2
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:2" "${{ needs.build.outputs.image_ref }}"
          echo "moved ${IMAGE}:2 -> ${{ needs.build.outputs.image_ref }}" >> "$GITHUB_STEP_SUMMARY"

      # The digest check is only as good as its memory. Committing the state is
      # also the audit trail: `git log .build-state.json` is the record of when
      # the toolchain moved under us.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record what was promoted
        env:
          V: ${{ needs.resolve.outputs.caddy_version }}
          R: ${{ needs.resolve.outputs.revision }}
          D: ${{ needs.resolve.outputs.builder_digest }}
        run: |
          set -euo pipefail
          jq -n --arg v "$V" --argjson r "$R" --arg d "$D" \
            '{caddy_version: $v, builder_digest: $d, revision: $r}' > .build-state.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .build-state.json
          git diff --staged --quiet && { echo "state unchanged"; exit 0; }
          git commit -m "chore: record caddy $V-$R" -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push
          echo "moved ${IMAGE}:2 -> ${{ needs.build.outputs.image_ref }}" >> "$GITHUB_STEP_SUMMARY"

  hold:
    name: Minor bump held for review
    needs: [resolve, build, test]
    if: >-
      github.event_name == 'schedule' && needs.resolve.outputs.bump == 'minor'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      # ⚠️ A minor Caddy release is NOT auto-promoted even when the suites are
      # green. Belune's proxy depends on specific admin-API behaviour, and a
      # change there breaks routing on every install at once — with the silent
      # symptom, where every domain 502s on a stack that looks healthy.
      - env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.resolve.outputs.caddy_version }}
          R: ${{ needs.resolve.outputs.revision }}
        run: |
          gh issue create --repo ${{ github.repository }} \
            --title "Caddy $V is a minor bump — review before promoting" \
            --body "$(printf '%s\n' \
              "\`${IMAGE}:$V-$R\` is built and the Belune suites pass against it." \
              "" \
              "The floating \`:2\` tag has **not** moved, because this is a minor upstream bump." \
              "Belune's proxy depends on specific admin-API behaviour (route-id traversal," \
              "matcher pairing, strip-after-features ordering, deterministic reconciler output," \
              "and the skip-list invariant). A change to any of it breaks routing on every" \
              "install at once, and the symptom is silent: every domain 502s on a stack that" \
              "looks healthy." \
              "" \
              "Promote with the \`Build\` workflow, \`promote: true\`, once reviewed.")"
